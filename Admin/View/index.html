<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div class="container">

        <form id="productForm" action="../controller/add_product.php" method="POST" enctype="multipart/form-data"
            novalidate>

            <h1>Add Product</h1>

            <p class="subtitle">
                Enter product information below.
            </p>


            <!-- PHP SUCCESS / ERROR MESSAGE -->

            <div id="formMessage" class="form-message" aria-live="polite"></div>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Product Name <span>*</span>
                </label>

                <input type="text" id="name" name="name" maxlength="100" placeholder="e.g. Classic T-Shirt">

                <small class="error" id="nameError"></small>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description <span>*</span>
                </label>

                <textarea id="description" name="description" rows="5" maxlength="1000"
                    placeholder="Enter product description"></textarea>

                <small class="error" id="descriptionError"></small>

            </div>


            <!-- SIZE CHART -->

            <div class="form-group">

                <label for="size_chart">
                    Size Chart
                </label>

                <textarea id="size_chart" name="size_chart" rows="6" placeholder='Example JSON:
{"S":{"chest":"36","length":"27"},"M":{"chest":"38","length":"28"}}'></textarea>

                <small class="hint">
                    You may enter normal text or valid JSON.
                </small>

                <small class="error" id="sizeChartError"></small>

            </div>


            <!-- PRICE + STOCK -->

            <div class="row">

                <div class="form-group">

                    <label for="price">
                        Price <span>*</span>
                    </label>

                    <input type="number" id="price" name="price" min="0.01" step="0.01" placeholder="0.00">

                    <small class="error" id="priceError"></small>

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock <span>*</span>
                    </label>

                    <input type="number" id="stock" name="stock" min="0" step="1" placeholder="0">

                    <small class="error" id="stockError"></small>

                </div>

            </div>


            <!-- GENDER -->

            <!-- <div class="form-group">

            <label for="gender">
                Gender <span>*</span>
            </label>

            <select
                id="gender"
                name="gender"
            >

                <option value="">
                    -- Select Gender --
                </option>

                <option value="Men">
                    Men
                </option>

                <option value="Women">
                    Women
                </option>

            </select>

            <small
                class="error"
                id="genderError"
            ></small>

        </div> -->


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category <span>*</span>
                </label>

                <select id="category" name="category">

                    <option value="">
                        -- Select Category --
                    </option>
                    <option value="men">
                        Men
                    </option>
                    <option value="woman">
                        Women
                    </option>
                    <option value="child">
                        Children
                    </option>

                </select>

                <small class="error" id="categoryError"></small>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label for="image">
                    Product Image <span>*</span>
                </label>

                <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png,image/jpeg,image/png">

                <small class="hint">
                    JPEG/PNG only, maximum 2MB.
                </small>

                <small class="error" id="imageError"></small>

            </div>


            <!-- BUTTON -->

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>


    <script src="../controller/script.js"></script>

</body>

</html>
